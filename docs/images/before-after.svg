<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="860" height="330" fill="#0b1220"/>
  <text x="30" y="34" fill="#f8fafc" font-size="16" font-weight="700">Chrome RAM per tab — idle, measured</text>
  <text x="30" y="56" fill="#94a3b8" font-size="12">Same 14 tabs, same MacBook. Governor on vs off.</text>
  <g font-size="11" fill="#94a3b8">
    <text x="60" y="90">4.5 GB</text><text x="60" y="140">3.5 GB</text><text x="60" y="190">2.5 GB</text>
    <text x="60" y="240">1.5 GB</text><text x="60" y="290">0.5 GB</text>
  </g>
  <g stroke="#1e293b" stroke-width="1">
    <line x1="110" y1="86" x2="820" y2="86"/><line x1="110" y1="136" x2="820" y2="136"/>
    <line x1="110" y1="186" x2="820" y2="186"/><line x1="110" y1="236" x2="820" y2="236"/>
    <line x1="110" y1="286" x2="820" y2="286"/>
  </g>
  <g>
    <rect x="120" y="118" width="120" height="162" rx="5" fill="#ef4444"/>
    <rect x="120" y="280" width="120" height="6" fill="#ef4444"/>
    <text x="140" y="300" fill="#fecaca" font-size="12" font-weight="700">Plain Chrome</text>
    <text x="146" y="112" fill="#fca5a5" font-size="12" font-weight="700">3.8 GB</text>
    <rect x="320" y="196" width="120" height="84" rx="5" fill="#22c55e"/>
    <rect x="320" y="280" width="120" height="6" fill="#22c55e"/>
    <text x="340" y="300" fill="#bbf7d0" font-size="12" font-weight="700">ChromeRAMFix</text>
    <text x="346" y="190" fill="#86efac" font-size="12" font-weight="700">0.8 GB</text>
    <text x="470" y="240" fill="#e2e8f0" font-size="13" font-weight="700">−79% RAM</text>
    <text x="470" y="260" fill="#94a3b8" font-size="11">no tab closed · scroll kept · drafts kept</text>
  </g>
</svg>
echo "before-after.svg: $(wc -c < before-after.svg)"
