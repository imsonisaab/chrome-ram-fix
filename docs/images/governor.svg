<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="860" height="330" fill="#0b1220"/>
  <text x="30" y="34" fill="#f8fafc" font-size="16" font-weight="700">Governor pressure — the real signal, not the whole machine</text>
  <text x="30" y="56" fill="#94a3b8" font-size="12">Launchd daemons lose /usr/sbin in PATH. Absolute paths are the fix; a 0 swap reading is a bug, not health.</text>
  <g font-size="11" fill="#94a3b8">
    <text x="60" y="90">4 GB</text><text x="60" y="140">3 GB</text><text x="60" y="190">2 GB</text>
    <text x="60" y="240">1 GB</text><text x="60" y="290">0 GB</text>
  </g>
  <g stroke="#1e293b"><line x1="110" y1="86" x2="820" y2="86"/><line x1="110" y1="136" x2="820" y2="136"/><line x1="110" y1="186" x2="820" y2="186"/><line x1="110" y1="236" x2="820" y2="236"/><line x1="110" y1="286" x2="820" y2="286"/></g>
  <polyline points="120,170 190,150 260,158 330,120 400,128 470,96 540,110 610,88 680,100 750,84 820,92" fill="none" stroke="#facc15" stroke-width="2.5"/>
  <polyline points="120,272 190,268 260,270 330,262 400,266 470,258 540,264 610,256 680,260 750,254 820,258" fill="none" stroke="#22c55e" stroke-width="2.5"/>
  <circle cx="610" cy="88" r="4" fill="#facc15"/>
  <text x="620" y="80" fill="#fde68a" font-size="11" font-weight="700">pressure ≥ L1 → idle window 45 s</text>
  <text x="120" y="312" fill="#facc15" font-size="12" font-weight="700">machine RAM (context)</text>
  <text x="420" y="312" fill="#22c55e" font-size="12" font-weight="700">browser RAM (what the governor controls)</text>
</svg>
echo "governor.svg: $(wc -c < governor.svg)"
