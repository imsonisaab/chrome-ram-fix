<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="860" height="330" fill="#0b1220"/>
  <text x="30" y="34" fill="#f8fafc" font-size="16" font-weight="700">What you see — and what you never have to</text>
  <text x="30" y="56" fill="#94a3b8" font-size="12">No popup UI ships by default; the extension reports status through the governor's /pressure endpoint.</text>
  <rect x="40" y="90" width="240" height="150" rx="10" fill="#111827" stroke="#334155"/>
  <text x="60" y="118" fill="#f8fafc" font-size="12" font-weight="700">ChromeRAMFix</text>
  <text x="60" y="144" fill="#22c55e" font-size="22" font-weight="700">0.8 GB</text>
  <text x="60" y="164" fill="#94a3b8" font-size="11">browser RAM · 14 tabs</text>
  <line x1="60" y1="180" x2="260" y2="180" stroke="#1f2937"/>
  <text x="60" y="200" fill="#cbd5e1" font-size="11">idle discarded  <tspan fill="#22c55e" font-weight="700">11</tspan></text>
  <text x="60" y="218" fill="#cbd5e1" font-size="11">protected open  <tspan fill="#facc15" font-weight="700">1</tspan></text>
  <text x="60" y="236" fill="#cbd5e1" font-size="11">floor  <tspan font-weight="700">15% of 460 GiB</tspan></text>
  <rect x="320" y="90" width="500" height="150" rx="10" fill="#111827" stroke="#334155"/>
  <text x="340" y="118" fill="#f8fafc" font-size="12" font-weight="700">/pressure (live from governor :8795)</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
    <text x="340" y="146" fill="#94a3b8">{</text>
    <text x="356" y="166" fill="#93c5fd">"pressureLevel"<tspan fill="#e2e8f0">: </tspan><tspan fill="#facc15">1</tspan><tspan fill="#e2e8f0">,</tspan></text>
    <text x="356" y="186" fill="#93c5fd">"swapMB"<tspan fill="#e2e8f0">: </tspan><tspan fill="#facc15">312</tspan><tspan fill="#e2e8f0">,</tspan></text>
    <text x="356" y="206" fill="#93c5fd">"browserRSS"<tspan fill="#e2e8f0">: </tspan><tspan fill="#22c55e">812</tspan><tspan fill="#e2e8f0">,</tspan></text>
    <text x="356" y="226" fill="#93c5fd">"idleWindowSec"<tspan fill="#e2e8f0">: </tspan><tspan fill="#22c55e">45</tspan></text>
    <text x="340" y="234" fill="#94a3b8">}</text>
  </g>
  <text x="40" y="278" fill="#64748b" font-size="12">No dashboard to babysit. No telemetry. No account. Every number above is a real measurement, never a default.</text>
</svg>
echo "popup.svg: $(wc -c < popup.svg)"
