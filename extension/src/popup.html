<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>BrowserRAM</title>
<style>
  body { font: 12px -apple-system, system-ui, sans-serif; width: 300px; margin: 0; padding: 12px; }
  h2 { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: #888; margin: 10px 0 4px; }
  .row { display: flex; justify-content: space-between; margin: 3px 0; }
  .lvl { font-weight: 600; }
  .lvl0 { color: #2e7d32; } .lvl1 { color: #558b2f; } .lvl2 { color: #ef6c00; }
  .lvl3 { color: #c62828; } .lvl4 { color: #b71c1c; }
  small { color: #666; }
</style>
</head>
<body>
<h2>Browser</h2>
<div class="row"><span>Pressure</span><span class="lvl" id="blvl">—</span></div>
<div class="row"><span>Browser RAM</span><span id="bmb">—</span></div>
<div class="row"><span>of system</span><span id="bpct">—</span></div>
<div class="row"><span>Processes</span><span id="bprocs">—</span></div>
<div class="row"><span>Discarded</span><span id="disc">—</span></div>
<div class="row"><span>Restored</span><span id="rest">—</span></div>

<hr>
<h2>System</h2>
<div class="row"><span>Free</span><span id="free">—</span></div>
<div class="row"><span>Swap</span><span id="swap">—</span></div>

<hr>
<div class="row"><span>Source</span><span id="src"><small>daemon/stale</small></span></div>
<small id="note">—</small>
<script src="popup.js"></script>
</body>
</html>
